version: '3'

tasks:
  default:
    cmds: [task --list]
  generate:
    desc: Generate and compile the gobee BPF programs
    cmds: [make generate]
  build:
    desc: Build shippo
    cmds: [make build]
  check:
    desc: Check Go formatting, vet, and compilation for both supported architectures
    deps: [generate]
    cmds:
      - test -z "$(gofmt -l $(git ls-files '*.go') internal/daemon/*_test.go)"
      - go vet ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .
      - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .
  lint:
    desc: Run Go lint and format checks
    deps: [generate]
    cmds:
      - golangci-lint run
      - golangci-lint fmt --diff
  test:
    desc: Run unit and real-kernel integration tests (requires Docker)
    cmds:
      - task: test:unit
      - task: test:integration
  test:unit:
    desc: Run unit tests with the race detector
    deps: [generate]
    cmds:
      - richgo test -count=1 -shuffle=on -race -coverprofile=coverage.out ./...
  test:integration:build:
    internal: true
    deps: [generate]
    cmds:
      - mkdir -p .test-bin
      - go build -race -o .test-bin/shippo .
      - go test -race -tags=integration -c -o .test-bin/daemon.test ./internal/daemon
  test:integration:
    desc: Test real eBPF and daemon lifecycle in an isolated privileged Docker container
    deps: [test:integration:build]
    cmds:
      - docker build -f test/integration.Dockerfile -t shippo-integration .
      - >-
        docker run --rm --privileged --network none
        --mount type=bind,source=/sys/kernel/tracing,target=/sys/kernel/tracing,readonly
        shippo-integration
