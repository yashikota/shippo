name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' ||
      github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup svu
        if: github.event_name == 'workflow_dispatch'
        uses: freerangebytes/setup-svu@3dcc2ead4b6be1287f9bfe2ac4764a826c110a4f # v0.2.1

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail

          version="$(svu "$BUMP_TYPE")"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$version"
          git push origin "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Created release tag: $version"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ steps.tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.60.1

      - name: Install BPF compiler and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate BPF objects
        run: task generate

      - name: Build release archives
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p dist
          ldflags="-s -w -X main.Version=${TAG}"

          for arch in amd64 arm64; do
            staging="dist/staging-linux-${arch}"
            rm -rf "$staging"
            mkdir -p "$staging"

            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "$ldflags" -o "$staging/shippo" .

            cp shippo.service "$staging/"

            archive="dist/shippo_${TAG}_linux_${arch}.tar.gz"
            tar -C "$staging" -czf "$archive" shippo shippo.service
            rm -rf "$staging"
          done

          (cd dist && sha256sum shippo_*.tar.gz > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/shippo_*.tar.gz
            dist/SHA256SUMS
